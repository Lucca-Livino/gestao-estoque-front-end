apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestao-estoque-front
spec:
  selector:
    matchLabels:
      app: gestao-estoque-front
  template:
    metadata:
      labels:
        app: gestao-estoque-front
    spec:
      containers:
      - name: gestao-estoque-front
        image: luccalivino/gestao-estoque-front:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: gestao-estoque-front-env
        resources: {}
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: garagehub
spec:
  selector:
    app: gestao-estoque-front
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
